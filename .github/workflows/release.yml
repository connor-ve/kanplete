name: Release

# Push a tag that matches the version in manifest.json (for example 0.1.1)
# and this makes a GitHub release with the three files Obsidian downloads.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(jq -r .version manifest.json)
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest version $version"
            exit 1
          fi
          jq -e --arg v "$version" 'has($v)' versions.json > /dev/null \
            || { echo "versions.json has no entry for $version"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title "$tag" --generate-notes \
            main.js manifest.json styles.css
